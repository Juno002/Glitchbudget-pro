name: Cleanup merged Prisma branch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-prisma-brand-branch.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged temporary branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/prisma-brand-icon" --silent
