name: Generate Prisma icon assets

on:
  push:
    branches:
      - prisma-brand-icon
    paths:
      - public/logo.svg
      - .github/workflows/generate-prisma-icons.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prisma-brand-icon

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Render Prisma icon assets
        run: |
          node --input-type=module <<'NODE'
          import sharp from 'sharp';

          const source = 'public/logo.svg';
          await sharp(source).resize(512, 512).png().toFile('public/icon-512.png');
          await sharp(source).resize(192, 192).png().toFile('public/icon-192.png');
          await sharp(source).resize(64, 64).png().toFile('src/app/icon.png');
          await sharp(source).resize(180, 180).png().toFile('src/app/apple-icon.png');
          NODE

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/icon-192.png public/icon-512.png src/app/icon.png src/app/apple-icon.png
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "assets: generate Prisma icon rasters"
          git push origin HEAD:prisma-brand-icon
