name: Phase 20.10.5 remote branch cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: startsWith(github.event.head_commit.message, 'Fase 20.10.5')
    runs-on: ubuntu-latest
    steps:
      - name: Delete every remote branch except main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mapfile -t branches < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name'
          )

          echo "Branches before cleanup: ${#branches[@]}"
          failures=0

          for branch in "${branches[@]}"; do
            if [[ "${branch}" == "main" ]]; then
              continue
            fi

            echo "Deleting ${branch}"
            if ! gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" --silent; then
              echo "::error::Failed to delete branch: ${branch}"
              failures=$((failures + 1))
            fi
          done

          if (( failures > 0 )); then
            echo "::error::Branch cleanup completed with ${failures} deletion failure(s)."
            exit 1
          fi

          mapfile -t remaining < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name'
          )

          printf 'Remaining branch: %s\n' "${remaining[@]}"

          if [[ "${#remaining[@]}" -ne 1 || "${remaining[0]}" != "main" ]]; then
            echo "::error::20.10.5 gate failed: expected only main."
            exit 1
          fi

      - name: Remove one-shot cleanup workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path=".github/workflows/phase-20-10-5-remote-branch-cleanup.yml"
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=main" --jq '.sha')"

          gh api             --method DELETE             "repos/${GITHUB_REPOSITORY}/contents/${path}"             -f message="chore: remove completed 20.10.5 cleanup workflow"             -f sha="${sha}"             -f branch="main"             --silent
